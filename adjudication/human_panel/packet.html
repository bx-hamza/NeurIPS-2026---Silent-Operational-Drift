<title>Withdrawn</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{ --ground:#f5f6f9; --ink:#171b23; --muted:#59616f; --rule:#e4e7ec;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --ground:#0d1017; --ink:#e7ebf2; --muted:#98a2b2; --rule:#222a35; } }
  :root[data-theme="dark"]{ --ground:#0d1017; --ink:#e7ebf2; --muted:#98a2b2; --rule:#222a35; }
  html,body{height:100%}
  body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans);
    display:grid; place-items:center; text-align:center; padding:1.5rem;}
  .card{max-width:34rem; border:1px solid var(--rule); border-radius:14px;
    padding:2rem 1.75rem; background:transparent}
  h1{font-size:1.4rem; letter-spacing:-.01em; margin:0 0 .5rem}
  p{color:var(--muted); line-height:1.6; margin:.4rem 0}
</style>
<div class="card">
  <h1>This packet has been withdrawn</h1>
  <p>The adjudication scoring form is no longer published here. It will be provided
     directly through the study's own channels.</p>
</div>
